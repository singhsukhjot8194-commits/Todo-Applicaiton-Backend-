{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Welcome, {{ user.username }}!</h1>
        <a href="/logout/">Logout</a>
      </div>

      <form method="POST" class="add-todo-form">
        {% csrf_token %}
        <input
          type="text"
          name="title"
          placeholder="Add a new todo..."
          required
        />
        <button type="submit">Add Todo</button>
      </form>

      <div class="todo-list">
        {% if res %} {% for item in res %}
        <div class="todo-item">
          <span>{{ item.title }}</span>
          <div class="actions">
            <a href="/edit_todo/{{ item.srno }}/">Edit</a>
            <a href="/delete_todo/{{ item.srno }}/">Delete</a>
          </div>
        </div>
        {% endfor %} {% else %}
        <p>No todos yet. Add one to get started!</p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
